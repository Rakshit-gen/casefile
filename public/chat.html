<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f5f4f0; --panel: #fff; --ink: #1c1c1a; --muted: #6c6b65; --line: #dad8d0; --me: #e6edf7; --bad: #b83a2a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --panel: #1f1f1d; --ink: #e8e6de; --muted: #9b9990; --line: #34332f; --me: #22303f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "IBM Plex Sans", system-ui, sans-serif; display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
  header span { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 8px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .inner { max-width: 720px; margin: 0 auto; }
  .m { margin: 0 0 12px; max-width: 88%; }
  .m .who { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .m .body { padding: 9px 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .m.customer { margin-left: auto; }
  .m.customer .who { text-align: right; }
  .m.customer .body { background: var(--me); }
  .m.pending .body { color: var(--muted); }
  .m.failed .body { border-color: var(--bad); }
  .m.failed .who { color: var(--bad); }
  .empty { color: var(--muted); text-align: center; margin-top: 15vh; }
  form { padding: 12px 16px; border-top: 1px solid var(--line); }
  form .inner { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); resize: none; max-height: 40vh; }
  button { font: inherit; padding: 8px 16px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 720px; margin: 4px auto 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>Support <span id="cid"></span></header>
<div id="log" aria-live="polite"><div class="inner" id="msgs"></div></div>
<form id="f">
  <div class="inner"><textarea id="t" rows="1" placeholder="Write a message" aria-label="Message" required></textarea><button id="b">Send</button></div>
  <p class="hint">Enter sends, Shift+Enter adds a line. Don't paste passwords or API tokens; if you do, they're removed and you should change them.</p>
</form>
<script>
const q = new URLSearchParams(location.hash.slice(1));
const caseId = q.get("case"), token = q.get("token");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const WHO = { customer: "You", agent: "Support" };
let busy = false, last = "", pending = null;

function bubble(role, text, cls = "", who = WHO[role] || role) {
  return `<div class="m ${role} ${cls}"><span class="who">${esc(who)}</span><div class="body">${esc(text)}</div></div>`;
}
// Only follow new messages if the reader is already at the bottom.
function render(html) {
  const log = $("log"), atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  $("msgs").innerHTML = html;
  if (atBottom) log.scrollTop = log.scrollHeight;
}
function fail(text) {
  $("msgs").innerHTML = `<p class="empty">${esc(text)}</p>`;
  $("t").disabled = $("b").disabled = true;
}

async function api(path, init = {}) {
  const r = await fetch(path, { ...init, headers: { "content-type": "application/json", authorization: `Bearer ${token}` } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) throw Object.assign(new Error("This chat link isn't valid. Ask support for a new one."), { fatal: true });
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

let messages = [];
function draw() {
  const extra = pending ? (pending.error ? bubble("customer", pending.text, "failed", "Not sent. Press Send to try again.") : bubble("customer", pending.text)) +
    (pending.error ? "" : bubble("agent", `Looking into it… ${pending.secs ? `${pending.secs}s` : ""}`, "pending")) : "";
  render(messages.map((m) => bubble(m.role, m.content)).join("") + extra || `<p class="empty">Describe the problem and which site it's on. Replies appear here.</p>`);
}

async function load() {
  if (busy) return;
  try {
    const msgs = await api(`/api/cases/${encodeURIComponent(caseId)}/transcript`);
    const key = JSON.stringify(msgs);
    if (key === last) return;
    last = key; messages = msgs.filter((m) => m.role !== "note"); draw();
  } catch (e) { if (e.fatal) fail(e.message); }
}

async function send() {
  const text = $("t").value.trim();
  if (!text || busy) return;
  busy = true; $("b").disabled = true;
  pending = { text, secs: 0 };
  const timer = setInterval(() => { pending.secs++; draw(); }, 1000);
  $("t").value = ""; grow(); draw();
  $("log").scrollTop = $("log").scrollHeight;
  try {
    await api(`/api/cases/${encodeURIComponent(caseId)}/messages`, { method: "POST", body: JSON.stringify({ text }) });
    pending = null;
  } catch (e) {
    if (e.fatal) { clearInterval(timer); return fail(e.message); }
    // Keep the text so it can be sent again.
    pending = { text, error: true };
    $("t").value = text; grow();
  }
  clearInterval(timer);
  busy = false; $("b").disabled = false; last = "";
  await load(); draw();
  $("t").focus();
}

function grow() { const t = $("t"); t.style.height = "auto"; t.style.height = `${t.scrollHeight + 2}px`; }
$("t").addEventListener("input", grow);
$("t").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("f").onsubmit = (e) => { e.preventDefault(); send(); };

if (!caseId || !token) fail("This page needs the link support sent you.");
else {
  $("cid").textContent = `case ${caseId}`;
  load(); $("t").focus();
  setInterval(load, 3000);
}
</script>
</body>
</html>
